site_name: Emanuele Marchetti
site_description: Technical writing portfolio by Emanuele Marchetti
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
nav:
  - Home: index.md
  - The blank checkout page: checkout-blank-page.md
  - A list that hides its own length: station-list-limit.md
  - "LEFT JOIN: disappearing rows": left-join-where.md
  - "COMP-3: a number that isn't": comp3-move.md